name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 26.2 requires Java 25; the Gradle toolchain block pins the same version.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew arrived on this repository without its executable bit, so a fresh checkout on a
      # Linux runner cannot run it ("Permission denied", exit 126). The bit is also set in the
      # index (git update-index --chmod=+x gradlew); this step keeps CI working even if some
      # later clone or archive drops the mode again.
      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Loom 1.18.2 writes an empty (22-byte) minecraft-merged.jar for 26.2 on the very first
      # run, and the first run also trips over the missing .backup sibling of that stub. The
      # repository's ensureMergedMinecraftJar task repairs both, but only on the run *after*
      # the one that produced the stub -- hence the deliberate two passes. The first pass is
      # expected to fail on a cold cache; the second is the one that has to go green.
      - name: Build (cold-cache pass, allowed to fail)
        continue-on-error: true
        run: ./gradlew build --no-daemon --console=plain

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: commandgrants-jar
          path: build/libs/*.jar
          if-no-files-found: error
