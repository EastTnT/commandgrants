# CommandGrants — build properties
#
# Target: Minecraft 26.2 (unobfuscated official jar => no mappings needed)
# Java:   25 (MC 26.2 requires Java 25)

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Minecraft / Fabric versions -------------------------------------------------
minecraft_version=26.2
# 26.2 ships unobfuscated classes, so no `mappings` dependency is declared in build.gradle.
fabric_loader_version=0.19.5
# Highest Fabric API build published for 26.2 (verified against maven.fabricmc.net maven-metadata.xml).
fabric_api_version=0.161.0+26.2

# --- Mod metadata ----------------------------------------------------------------
mod_version=1.0.0
maven_group=com.example
archives_base_name=commandgrants

# --- Network mirrors -------------------------------------------------------------
# This machine's shell cannot complete TLS handshakes with services.gradle.org /
# downloads.gradle.org (PKIX path building failed), so the wrapper distribution URL
# points at a mirror. Restore the official URL if your network reaches it:
#   https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
