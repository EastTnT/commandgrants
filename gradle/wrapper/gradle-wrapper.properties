distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# services.gradle.org is not reachable from the machine this was developed on: a local
# TLS-terminating proxy breaks PKIX path building there, so the distribution comes from a
# mirror. On a normal network, swap the two distributionUrl lines below (activate the
# commented official one, delete the mirror one).
#
# No distributionSha256Sum is pinned on purpose: the mirror and the official host serve
# equivalent-but-not-byte-identical archives, so a pinned hash would reject whichever host
# it was not taken from.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip
# Official:
# distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip

networkTimeout=60000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
